<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C & Embedded Library</title>
<meta name="theme-color" content="#080612">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --sp{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{
 --bg:#080612;--surf:#110d21;--surf2:#1a1433;--tx:#f3eeff;--tx2:#c5bce6;--mut:#8f85b8;--bd:#271f47;
 --p1:#ff5ea8;--p2:#ff9f43;--p3:#ffd23f;--p4:#3be39a;--p5:#37d5ff;--p6:#6f8dff;--p7:#b87bff;
 --ac:var(--p5);--ac2:var(--p7);--ac3:var(--p1);
 --rainbow:linear-gradient(100deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7));
 --rb-loop:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7),var(--p1));
 --code:#0a0716;--codetx:#e8e2ff;
 --glow:0 0 0 1px color-mix(in srgb,var(--p7) 12%,transparent),0 24px 56px -28px color-mix(in srgb,var(--p7) 55%,transparent);
 --fs:17px;--ease:cubic-bezier(.22,1,.36,1);--ease2:cubic-bezier(.32,.72,0,1);
 color-scheme:dark}
:root[data-theme=light]{--bg:#faf7ff;--surf:#fff;--surf2:#f0eafd;--tx:#1b1336;--tx2:#4b4272;--mut:#7c72a3;--bd:#e3dbf6;
 --p1:#e22d7e;--p2:#e8680a;--p3:#c48f00;--p4:#0a9d66;--p5:#0592c4;--p6:#3557ff;--p7:#8a42e6;
 --glow:0 0 0 1px color-mix(in srgb,var(--p7) 12%,transparent),0 20px 44px -26px color-mix(in srgb,var(--p7) 55%,transparent);color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:96px;-webkit-text-size-adjust:100%;scrollbar-color:color-mix(in srgb,var(--p7) 45%,transparent) transparent}
body{font:400 var(--fs)/1.8 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.open{overflow:hidden}
::selection{background:color-mix(in srgb,var(--ac) 35%,transparent)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ambient multicolor aurora: transform-only motion (GPU), no blur filters */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;contain:layout paint}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;will-change:transform;opacity:.6}
.bg i:nth-child(1){top:-32vmax;right:-20vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--p7) 40%,transparent),transparent);animation:d1 28s ease-in-out infinite alternate}
.bg i:nth-child(2){bottom:-36vmax;left:-24vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--p5) 30%,transparent),transparent);animation:d2 34s ease-in-out infinite alternate}
.bg i:nth-child(3){top:26vh;left:30vw;width:46vmax;height:46vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--p1) 26%,transparent),transparent);animation:d3 40s ease-in-out infinite alternate}
.bg i:nth-child(4){top:-20vmax;left:-18vmax;width:42vmax;height:42vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--p2) 22%,transparent),transparent);animation:d4 36s ease-in-out infinite alternate}
:root[data-theme=light] .bg i{opacity:.42}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--bd) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,var(--bd) 1px,transparent 1px) 0 0/56px 56px;opacity:.36;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 0,#000,transparent);mask-image:radial-gradient(ellipse 80% 70% at 50% 0,#000,transparent)}
@keyframes d1{to{transform:translate3d(-14vmax,10vmax,0) scale(1.15)}}
@keyframes d2{to{transform:translate3d(16vmax,-8vmax,0) scale(1.1)}}
@keyframes d3{to{transform:translate3d(-12vmax,-12vmax,0) scale(.85)}}
@keyframes d4{to{transform:translate3d(18vmax,14vmax,0) scale(1.2)}}

#bar{position:fixed;top:0;left:0;right:0;height:3px;clip-path:inset(0 100% 0 0);background:var(--rainbow);z-index:80}

/* header */
header{position:sticky;top:12px;z-index:50;display:flex;align-items:center;gap:10px;margin:12px auto 0;max-width:1240px;width:calc(100% - 24px);padding:8px 10px 8px 16px;border-radius:22px;-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);background:color-mix(in srgb,var(--surf) 72%,transparent);border:1px solid var(--bd);box-shadow:var(--glow);transition:box-shadow .5s var(--ease),border-color .5s}
header.scrolled{border-color:color-mix(in srgb,var(--p7) 30%,var(--bd));box-shadow:0 0 0 1px color-mix(in srgb,var(--p7) 10%,transparent),0 18px 44px -18px #000a}
:root[data-theme=light] header.scrolled{box-shadow:0 14px 36px -18px #5a3fb055}
.logo{font:700 18px 'Space Grotesk',sans-serif;letter-spacing:-.01em;white-space:nowrap;display:flex;gap:9px;align-items:center;flex:none}
.logo span{background:var(--rb-loop) 0 0/200% 100% repeat-x;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 10s linear infinite}
.logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--p1),var(--p2) 45%,var(--p7));color:#fff;font-size:15px;box-shadow:0 6px 18px -6px var(--p1);transition:transform .6s var(--ease)}
.logo:hover b{transform:rotate(-12deg) scale(1.1)}
@keyframes flow{to{background-position:200% 0}}
.tabs{position:relative;display:flex;gap:2px;margin:0 auto;padding:4px;min-width:0;overflow-x:auto;scrollbar-width:none;border-radius:15px;background:color-mix(in srgb,var(--surf2) 60%,transparent);border:1px solid var(--bd)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;z-index:1;flex:none;padding:8px 16px;border-radius:11px;font:500 13.5px 'JetBrains Mono',monospace;color:var(--mut);white-space:nowrap;transition:color .3s,transform .3s var(--ease)}
.tabs button:hover{color:var(--ac)}.tabs button.on{color:var(--ac)}.tabs button:active{transform:scale(.95)}
.pill{position:absolute;left:0;top:4px;bottom:4px;width:0;border-radius:11px;background:color-mix(in srgb,var(--ac) 17%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 45%,transparent),0 6px 20px -8px var(--ac);will-change:transform,width}
.pill.ready{transition:transform .6s var(--ease),width .6s var(--ease),background-color .5s,box-shadow .5s}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--mut);flex:none;font:600 14px Inter,system-ui,sans-serif;transition:background-color .3s,color .3s,transform .35s var(--ease)}
.ib:hover{background:var(--surf2);color:var(--p1)}.ib:active{transform:scale(.88)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#menu{display:none}
#menu path{transform-box:fill-box;transform-origin:center;transition:transform .5s var(--ease),opacity .25s}
body.open #menu path:nth-child(1){transform:translateY(5px) rotate(45deg)}
body.open #menu path:nth-child(2){opacity:0;transform:scaleX(0)}
body.open #menu path:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
#th{display:grid}#th svg{grid-area:1/1;transition:transform .7s var(--ease),opacity .4s}
:root[data-theme=dark] #th .moon{opacity:0;transform:rotate(-90deg) scale(.4)}
:root[data-theme=light] #th .sun{opacity:0;transform:rotate(90deg) scale(.4)}
:root[data-theme=dark] #th{color:var(--p3)}:root[data-theme=light] #th{color:var(--p7)}

.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:8px;max-width:1264px;margin:0 auto;padding:0 12px}

/* sidebar */
aside{position:sticky;top:92px;height:calc(100vh - 108px);height:calc(100dvh - 108px);overflow:auto;overscroll-behavior:contain;margin-top:16px;padding:16px 12px 24px;border-radius:22px;background:color-mix(in srgb,var(--surf) 78%,transparent);border:1px solid var(--bd);scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
#q{width:100%;padding:11px 14px;border-radius:13px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:400 13px 'JetBrains Mono',monospace;outline:0;margin-bottom:12px;transition:border-color .3s,box-shadow .4s var(--ease)}
#q:focus{border-color:var(--p5);box-shadow:0 0 0 4px color-mix(in srgb,var(--p5) 18%,transparent)}
#toc{position:relative}
.ind{position:absolute;left:0;top:0;width:100%;height:0;border-radius:10px;background:color-mix(in srgb,var(--ac) 14%,transparent);pointer-events:none;opacity:0;will-change:transform;transition:transform .55s var(--ease),height .55s var(--ease),opacity .3s,background-color .5s}
.ind::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--ac);box-shadow:0 0 12px var(--ac);transition:background-color .5s,box-shadow .5s}
aside .part{font:500 10.5px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin:20px 10px 6px}
aside a{position:relative;isolation:isolate;display:block;padding:8px 12px 8px 28px;border-radius:10px;color:var(--mut);text-decoration:none;font:500 13.5px/1.4 Inter,system-ui,sans-serif;transition:color .25s,transform .45s var(--ease)}
aside a::before{content:"";position:absolute;left:12px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--ac);opacity:.5;transition:transform .45s var(--ease),opacity .3s,box-shadow .4s}
aside a::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:10px;background:var(--surf2);opacity:0;transition:opacity .25s}
aside a:hover{color:var(--tx);transform:translate3d(4px,0,0)}aside a:hover::after{opacity:1}aside a:hover::before{opacity:1;transform:scale(1.4)}
aside a.on{color:var(--ac)}aside a.on::after{opacity:0}aside a.on::before{opacity:1;transform:scale(1.6);box-shadow:0 0 10px var(--ac)}
aside [hidden]{display:none!important}
.none{color:var(--mut);font-size:13px;padding:10px 12px}

/* hero: rotating rainbow border + colour-reactive spotlight */
main{padding:28px clamp(16px,4vw,56px) 140px;min-width:0}
.hero{position:relative;isolation:isolate;overflow:hidden;margin-bottom:56px;padding:44px 40px;border-radius:28px;border:1.5px solid transparent;
 background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 16%,var(--surf)),var(--surf) 62%) padding-box,conic-gradient(from var(--ang),var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7),var(--p1)) border-box;
 box-shadow:0 34px 70px -38px color-mix(in srgb,var(--ac) 65%,transparent);animation:spin 10s linear infinite}
@keyframes spin{to{--ang:360deg}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(440px circle at var(--mx,82%) var(--my,0%),color-mix(in srgb,var(--ac) 20%,transparent),transparent 62%)}
.hero::after{content:"</>";position:absolute;right:26px;top:8px;font:700 120px 'Space Grotesk',sans-serif;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.13;pointer-events:none;animation:fl 9s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate3d(0,14px,0) rotate(-3deg)}}
.kicker{display:flex;align-items:center;gap:10px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.22em;color:var(--ac);margin-bottom:16px}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--ac);animation:pl 2.4s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.hero h1{font:700 clamp(32px,5.4vw,52px)/1.04 'Space Grotesk',sans-serif;letter-spacing:-.04em;margin-bottom:14px;background:var(--rb-loop) 0 0/200% 100% repeat-x;-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em;animation:flow 12s linear infinite}
.hero p{color:var(--tx2);max-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{font:500 12px 'JetBrains Mono',monospace;padding:6px 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ac) 38%,var(--bd));background:color-mix(in srgb,var(--ac) 10%,var(--surf2));color:var(--tx2);transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.chip:hover{transform:translate3d(0,-3px,0);box-shadow:0 10px 22px -12px var(--ac)}
.chip b{color:var(--ac);font-weight:600}
.chip:nth-child(1){--ac:var(--p1)}.chip:nth-child(2){--ac:var(--p4)}.chip:nth-child(3){--ac:var(--p2)}

/* article: --ac/--ac2 are set per section from JS, so every part gets its own colours */
article{max-width:790px}
.rv{opacity:0;transform:translate3d(0,22px,0);transition:opacity .75s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
pre.rv{transform:translate3d(0,28px,0) scale(.975);transition:opacity .75s var(--ease),transform .9s var(--ease),border-color .4s,box-shadow .5s var(--ease),--sp .6s var(--ease)}
pre.rv.in{transform:none}
article h1{font:700 32px 'Space Grotesk',sans-serif;margin:84px 0 12px;padding-top:26px;border-top:1px dashed var(--bd);letter-spacing:-.025em;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
article h2{position:relative;font:700 clamp(25px,3.4vw,33px)/1.2 'Space Grotesk',sans-serif;margin:60px 0 18px;letter-spacing:-.028em;scroll-margin-top:96px;text-wrap:balance}
article h2::before{content:"#";background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:10px;font-weight:500}
article h2::after{content:"";display:block;width:76px;height:3px;margin-top:12px;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));transform:scaleX(0);transform-origin:0 50%;transition:transform 1s var(--ease) .3s}
article h2.in::after{transform:none}
article h3{font:600 14px 'JetBrains Mono',monospace;margin:36px 0 10px;color:var(--ac);text-transform:uppercase;letter-spacing:.08em}
article p{margin:0 0 16px;color:var(--tx2);text-wrap:pretty}
article ul{margin:0 0 18px;padding-left:22px;color:var(--tx2)}li{margin:5px 0}li::marker{color:var(--ac)}
article strong{font-weight:600;color:var(--tx)}
code{font:400 .84em 'JetBrains Mono',monospace;background:color-mix(in srgb,var(--ac) 12%,var(--surf2));color:var(--ac);padding:.15em .45em;border-radius:6px}
pre{position:relative;background:var(--code);color:var(--codetx);border-radius:18px;margin:0 0 26px;border:1px solid color-mix(in srgb,var(--ac) 26%,var(--bd));
 background:radial-gradient(380px circle at var(--mx,70%) var(--my,0px),color-mix(in srgb,var(--ac) var(--sp),transparent),transparent 65%),var(--code);
 box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 8%,transparent),0 26px 56px -32px color-mix(in srgb,var(--ac) 55%,transparent);overflow:hidden;transition:border-color .4s,box-shadow .5s var(--ease),--sp .6s var(--ease)}
pre:hover{border-color:color-mix(in srgb,var(--ac) 55%,var(--bd));--sp:13%}
pre::before{content:"";display:block;height:38px;border-bottom:1px solid color-mix(in srgb,var(--ac) 30%,transparent);background:radial-gradient(circle at 20px 50%,#ff5f57 5px,transparent 5.5px),radial-gradient(circle at 40px 50%,#febc2e 5px,transparent 5.5px),radial-gradient(circle at 60px 50%,#28c840 5px,transparent 5.5px),linear-gradient(90deg,color-mix(in srgb,var(--ac) 14%,transparent),color-mix(in srgb,var(--ac2) 10%,transparent))}
pre::after{content:"C";position:absolute;top:0;left:0;right:0;height:38px;text-align:center;font:500 11px/38px 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--ac);opacity:.8;pointer-events:none}
pre code{display:block;background:none;color:inherit;padding:16px 20px 18px;overflow-x:auto;overscroll-behavior-x:contain;font-size:13.5px;line-height:1.7;tab-size:4;scrollbar-width:thin;scrollbar-color:#ffffff22 transparent}
.cp{position:absolute;top:6px;right:8px;font:500 11px 'JetBrains Mono',monospace;color:#a79dcc;padding:5px 11px;border-radius:9px;border:1px solid #ffffff14;background:#ffffff08;transition:color .25s,background-color .25s,border-color .25s,transform .35s var(--ease)}
.cp:hover{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 50%,transparent)}.cp:active{transform:scale(.92)}
.cp.ok{color:#04110d;background:var(--p4);border-color:var(--p4)}
/* multicolour syntax highlighting (code blocks stay dark in both themes) */
pre .k{color:#ff6ac1}            /* control flow  */
pre .t{color:#5ce1ff}            /* types         */
pre .sc{color:#c792ff}           /* storage / qualifiers */
pre .s{color:#8bf3a6}            /* strings       */
pre .h{color:#8bf3a6;font-style:italic} /* <headers> */
pre .n{color:#ffb454}            /* numbers       */
pre .c{color:#6e7bab;font-style:italic} /* comments */
pre .p{color:#ffd866}            /* preprocessor  */
pre .f{color:#7aa2ff}            /* function calls */
pre .m{color:#ff8f6b}            /* MACROS        */
pre .l{color:#ff9e64;font-weight:500} /* NULL true false */
pre .a{color:#7df9c8}            /* struct members */
pre .o{color:#b9a9f0}            /* operators     */
.tw{overflow-x:auto;overscroll-behavior-x:contain;margin:0 0 26px;border:1px solid color-mix(in srgb,var(--ac) 24%,var(--bd));border-radius:18px;background:var(--surf);box-shadow:0 20px 48px -32px color-mix(in srgb,var(--ac) 55%,transparent)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55}
th{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 18%,var(--surf2)),color-mix(in srgb,var(--ac2) 14%,var(--surf2)));text-align:left;font:500 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);white-space:nowrap}
th,td{padding:12px 16px;border-bottom:1px solid var(--bd);vertical-align:top}
td{color:var(--tx2);transition:background-color .25s}td:first-child{color:var(--tx);font-weight:500}tr:last-child td{border:0}tr:hover td{background:color-mix(in srgb,var(--ac) 8%,transparent)}

#top{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p7));box-shadow:0 12px 30px -10px color-mix(in srgb,var(--p1) 75%,transparent);opacity:0;transform:translate3d(0,26px,0) scale(.8);pointer-events:none;z-index:60;transition:opacity .4s var(--ease),transform .6s var(--ease)}
#top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
#top.show{opacity:1;transform:none;pointer-events:auto}
#top.show:hover{transform:translate3d(0,-4px,0)}#top:hover svg{transform:translate3d(0,-2px,0)}#top.show:active{transform:scale(.9)}
#scrim{position:fixed;inset:0;background:#000a;z-index:65;opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s .4s}
body.open #scrim{opacity:1;visibility:visible;transition:opacity .4s var(--ease)}

/* theme switch: circular reveal via View Transitions, crossfade fallback */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .45s,color .45s,border-color .45s,box-shadow .45s!important}

/* progress, practice, login */
.prac{margin:6px 0 34px;padding:16px 18px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--ac) 50%,var(--bd));background:color-mix(in srgb,var(--ac) 7%,var(--surf))}
.prac b{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.prac ul{margin:8px 0 12px 20px;color:var(--tx2);font-size:15px}
.prac label{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:500;font-size:14.5px}
.prac input{width:18px;height:18px;accent-color:var(--ac)}
.pgw{display:flex;align-items:center;gap:12px;margin-top:20px}

<template id="book-micro"><p><strong>Microcontrollers</strong></p>
<p>Simple guide</p>
<p><em>Easy hardware guide</em></p>
<h1 id="part-a">Part A: The Basics</h1>
<h2 id="mpu-vs-mcu">1. Microprocessor vs Microcontroller</h2>
<p>A <strong>microprocessor (MPU)</strong> is only the brain (CPU). It needs separate memory, storage and ports. A <strong>microcontroller (MCU)</strong> is a tiny computer on one chip: CPU + memory + ports + timers. Think of an MPU as an engine and an MCU as a complete scooter.</p>
<div class="tw"><table><tr><th>Feature</th><th>Microprocessor</th><th>Microcontroller</th></tr>
<tr><td>Contains</td><td>CPU only</td><td>CPU + RAM + Flash + I/O + timers</td></tr>
<tr><td>Needs outside parts</td><td>Yes (RAM, storage, I/O chips)</td><td>Usually no</td></tr>
<tr><td>Speed</td><td>GHz</td><td>MHz (8 MHz to a few hundred MHz)</td></tr>
<tr><td>Power use</td><td>Watts</td><td>Milliwatts, can sleep on microamps</td></tr>
<tr><td>Cost</td><td>High</td><td>Low (from about $1)</td></tr>
<tr><td>Runs</td><td>Full OS (Linux, Windows)</td><td>One program, or a small RTOS</td></tr>
<tr><td>Examples</td><td>Intel Core, ARM Cortex-A (Raspberry Pi)</td><td>ATmega328P (Arduino), STM32, ESP32</td></tr>
<tr><td>Used in</td><td>Laptops, phones, Raspberry Pi</td><td>Washing machines, remotes, cars, drones</td></tr></table></div>
<h2 id="history">2. Who Invented What, and When</h2>
<div class="tw"><table><tr><th>What</th><th>Who</th><th>When</th></tr>
<tr><td>First microprocessor (Intel 4004)</td><td>Federico Faggin, Ted Hoff, Masatoshi Shima (Intel)</td><td>1971</td></tr>
<tr><td>First microcontroller (TMS1000)</td><td>Texas Instruments (Gary Boone, Michael Cochran)</td><td>1971 (sold 1974)</td></tr>
<tr><td>Intel 8051 (famous 8-bit MCU)</td><td>Intel</td><td>1980</td></tr>
<tr><td>PIC and AVR families</td><td>Microchip (PIC, 1990s); Atmel (AVR, 1996)</td><td>1990s</td></tr>
<tr><td>Arduino</td><td>Massimo Banzi and team, Ivrea, Italy</td><td>2005</td></tr>
<tr><td>STM32 (ARM Cortex-M3)</td><td>STMicroelectronics</td><td>2007</td></tr>
<tr><td>ESP8266 (Wi-Fi chip)</td><td>Espressif Systems (China)</td><td>2014</td></tr>
<tr><td>ESP32 (Wi-Fi + Bluetooth)</td><td>Espressif Systems</td><td>2016</td></tr>
<tr><td>Raspberry Pi</td><td>Eben Upton, Raspberry Pi Foundation (UK)</td><td>2012</td></tr></table></div>
<p>Dates are the commonly quoted ones; check the maker's site if you need exact details for an exam.</p>
<h2 id="inside-mcu">3. What Is Inside a Microcontroller</h2>
<ul>
<li><strong>CPU:</strong> runs your instructions.</li>
<li><strong>Flash:</strong> stores your program; it stays when power is off.</li>
<li><strong>RAM (SRAM):</strong> stores variables while running; it is lost at power off.</li>
<li><strong>EEPROM:</strong> small memory for settings you want to keep.</li>
<li><strong>GPIO:</strong> pins you set as input (read a button) or output (turn on an LED).</li>
<li><strong>Timers:</strong> count time, make PWM (dimming, motor speed).</li>
<li><strong>ADC:</strong> turns a voltage (sensor) into a number.</li>
<li><strong>UART, SPI, I2C:</strong> ways to talk to other chips and sensors.</li>
<li><strong>Interrupt controller:</strong> lets hardware say "stop and handle me now".</li>
<li><strong>Clock and watchdog:</strong> the heartbeat, and a safety timer that resets a stuck chip.</li>
</ul>
<h3>Common pins</h3>
<div class="tw"><table><tr><th>Pin</th><th>Meaning</th></tr>
<tr><td>VCC / VDD / 3V3 / 5V</td><td>Power in</td></tr><tr><td>GND</td><td>Ground (0 V)</td></tr>
<tr><td>RESET</td><td>Restart the chip</td></tr><tr><td>XTAL</td><td>Connects the crystal (clock)</td></tr>
<tr><td>GPIO / Dx / Px</td><td>General input or output</td></tr><tr><td>A0, A1... (ADC)</td><td>Read analog voltage</td></tr>
<tr><td>TX / RX</td><td>Serial send / receive</td></tr><tr><td>SDA / SCL</td><td>I2C data / clock</td></tr>
<tr><td>MOSI / MISO / SCK / CS</td><td>SPI lines</td></tr></table></div>
<h2 id="voltage">4. Voltage and Power in Simple Words</h2>
<p><strong>Logic level</strong> is the voltage that means "1" on a pin. <strong>Input voltage</strong> is what powers the board. <strong>Output</strong> is what a pin gives out, and it can only supply a few milliamps, so use a transistor for motors and relays. Never put 5 V on a 3.3 V pin: it can kill the chip.</p>
<div class="tw"><table><tr><th>Board</th><th>Logic level</th><th>Power in</th><th>Pin current (approx.)</th></tr>
<tr><td>Arduino Uno</td><td>5 V</td><td>USB 5 V or 7-12 V on VIN</td><td>20 mA safe, 40 mA max</td></tr>
<tr><td>ESP8266</td><td>3.3 V</td><td>USB 5 V (board regulates to 3.3 V)</td><td>about 12 mA</td></tr>
<tr><td>ESP32</td><td>3.3 V</td><td>USB 5 V or 3.3 V pin</td><td>about 12 mA safe, 40 mA max</td></tr>
<tr><td>STM32 (Blue Pill)</td><td>3.3 V (many pins 5 V tolerant)</td><td>USB 5 V or 3.3 V</td><td>about 20 mA, 25 mA max</td></tr>
<tr><td>Raspberry Pi</td><td>3.3 V (not 5 V tolerant)</td><td>5 V, 2.5-3 A supply</td><td>about 16 mA per pin</td></tr></table></div>
<p>Values vary by exact board; read the datasheet before connecting anything big.</p>
<h1 id="part-b">Part B: The Boards</h1>
<h2 id="arduino">5. Arduino (ATmega328P)</h2>
<p>The easiest start. Uno: 8-bit AVR, 16 MHz, 32 KB Flash, 2 KB RAM, 14 digital pins, 6 analog inputs (10-bit ADC, 0-1023). The Arduino is the board; the ATmega328P is its microcontroller.</p>
<pre><code>void setup() {
    pinMode(13, OUTPUT);
}
void loop() {
    digitalWrite(13, HIGH);
    delay(500);
    digitalWrite(13, LOW);
    delay(500);
}</code></pre>
<h2 id="esp">6. ESP8266 and ESP32</h2>
<p>Cheap boards with built-in Wi-Fi, made for IoT (gadgets on the internet). The ESP32 is the bigger sibling.</p>
<div class="tw"><table><tr><th>Feature</th><th>ESP8266</th><th>ESP32</th></tr>
<tr><td>CPU</td><td>1 core, 80 MHz</td><td>2 cores, up to 240 MHz</td></tr>
<tr><td>Wireless</td><td>Wi-Fi</td><td>Wi-Fi + Bluetooth</td></tr>
<tr><td>Analog input</td><td>1 pin, 0-1 V, 10-bit</td><td>Many pins, 12-bit</td></tr>
<tr><td>Touch pins</td><td>No</td><td>Yes (capacitive)</td></tr>
<tr><td>RAM</td><td>about 80 KB</td><td>about 520 KB</td></tr>
<tr><td>Price</td><td>Lowest</td><td>Low</td></tr></table></div>
<pre><code>int v = touchRead(4);
if (v &lt; 30) {
    digitalWrite(2, HIGH);
}</code></pre>
<h2 id="stm32">7. STM32</h2>
<p>A big family of ARM Cortex-M chips from STMicroelectronics (32-bit, 3.3 V, 72 MHz on the F103 up to hundreds of MHz on others). It is used in real products and is the best choice for learning registers, timers, DMA and RTOS.</p>
<h2 id="pi">8. Raspberry Pi</h2>
<p>The Raspberry Pi 3/4/5 is a small <strong>computer</strong> (microprocessor, Linux, HDMI, USB). It is not a microcontroller. The <strong>Raspberry Pi Pico</strong> (RP2040 chip, 2021) is the microcontroller version. A Pi is great for cameras and AI; an MCU is better for fast, exact timing and battery life.</p>
<h2 id="sensors">9. Built-in Sensors and How They Work</h2>
<div class="tw"><table><tr><th>Board</th><th>Built-in sensors</th></tr>
<tr><td>Arduino Uno</td><td>Internal temperature sensor on the chip (rough, about 1-2 degrees off); none on the board</td></tr>
<tr><td>ESP8266</td><td>None. Its ADC can read its own supply voltage</td></tr>
<tr><td>ESP32</td><td>Capacitive touch pins; internal temperature sensor; hall sensor on older chips</td></tr>
<tr><td>STM32</td><td>Internal temperature sensor and voltage reference on the ADC</td></tr>
<tr><td>Raspberry Pi</td><td>CPU temperature (command: vcgencmd measure_temp)</td></tr></table></div>
<p><strong>Capacitive touch:</strong> a pin and a metal pad hold a tiny electric charge. A finger adds capacitance, so the pad charges more slowly. The chip measures this time and gives a smaller number when touched.</p>
<p><strong>Analog sensors (ADC):</strong> the sensor gives a voltage. The ADC turns it into a number: value = voltage / reference x maximum count (1023 for 10-bit, 4095 for 12-bit).</p>
<h2 id="rtos">10. RTOS in Simple Words</h2>
<p>An RTOS (real-time operating system) lets you run several jobs ("tasks") at once, like blinking an LED while reading a sensor. A <strong>scheduler</strong> switches between tasks very fast. A <strong>queue</strong> passes data between tasks, a <strong>mutex</strong> stops two tasks using one thing at the same time, and a <strong>semaphore</strong> signals an event. FreeRTOS runs on ESP32 and STM32.</p>
<pre><code>void blinkTask(void *arg) {
    while (1) {
        digitalWrite(2, !digitalRead(2));
        vTaskDelay(500 / portTICK_PERIOD_MS);
    }
}
void setup() {
    pinMode(2, OUTPUT);
    xTaskCreate(blinkTask, "blink", 2048, NULL, 1, NULL);
}</code></pre>
<h2 id="temp-control">11. Temperature Control Project</h2>
<p>An LM35 sensor gives 10 mV per degree C (25 C = 0.25 V). Read it with the ADC, turn the fan on above 30 C, and off below 28 C. The gap (hysteresis) stops the fan from flickering.</p>
<pre><code>int raw = analogRead(A0);
float volts = raw * 5.0 / 1023.0;
float tempC = volts * 100.0;
if (tempC &gt; 30.0) {
    digitalWrite(FAN, HIGH);
} else if (tempC &lt; 28.0) {
    digitalWrite(FAN, LOW);
}</code></pre>
<h1 id="part-c">Part C: Interview Questions</h1>
<h2 id="interview">12. Interview Questions with Short Answers</h2>
<ul>
<li><strong>MPU vs MCU?</strong> An MPU is a CPU only and needs external parts. An MCU has CPU, memory and I/O on one chip.</li>
<li><strong>What is the ESP32?</strong> A low-cost Wi-Fi + Bluetooth dual-core MCU from Espressif, 3.3 V logic.</li>
<li><strong>ESP8266 vs ESP32?</strong> ESP32 has two cores, Bluetooth, more pins, touch sensing and more RAM.</li>
<li><strong>Arduino vs STM32?</strong> Arduino Uno is 8-bit, 5 V and beginner friendly. STM32 is 32-bit ARM, faster and used in products.</li>
<li><strong>Is Raspberry Pi a microcontroller?</strong> No. It is a single-board computer with a microprocessor running Linux.</li>
<li><strong>Why 3.3 V logic?</strong> Lower power and heat, and it suits modern fast chips.</li>
<li><strong>Why can't a pin drive a motor?</strong> It supplies only milliamps. Use a transistor or driver.</li>
<li><strong>What is an RTOS and when do you need one?</strong> It runs multiple tasks with deadlines; use it when many jobs must run on time.</li>
<li><strong>Flash vs RAM?</strong> Flash keeps the program with power off. RAM holds variables and is lost at power off.</li>
<li><strong>What is a watchdog timer?</strong> A timer that resets the chip if the program hangs.</li>
</ul></template>

<h1 id="part-a-detailed-guide">Part A: Detailed Guide</h1>
<h2 id="1-how-c-works">1. How C Works</h2>
<p>C is a compiled, procedural, low-level language. Source code goes through four stages: preprocessing (<code>#include</code>, <code>#define</code>), compilation (to assembly), assembly (to an object file), and linking (to an executable).</p>
<pre><code>#include &lt;stdio.h&gt;</code></pre>
<pre><code>int main(void) {
    printf(&quot;Hello, C\n&quot;);
    return 0;
}</code></pre>
<p>Compile with <code>gcc -Wall -Wextra -g main.c -o main</code>. Always turn warnings on and take them seriously.</p>
<h2 id="2-data-types-and-operators">2. Data Types and Operators</h2>
<ul>
<li>Integers: <code>char</code>, <code>short</code>, <code>int</code>, <code>long</code>, <code>long long</code>, each <code>signed</code> or <code>unsigned</code>. Use <code>&lt;stdint.h&gt;</code> (<code>int32_t</code>, <code>uint8_t</code>) when exact size matters.</li>
<li>Floating point: <code>float</code>, <code>double</code>. Never compare with <code>==</code>; compare with a small tolerance.</li>
<li>Sizes are implementation-defined. Typical 64-bit: char 1, short 2, int 4, long 8 (Linux/macOS), float 4, double 8, pointer 8. Use <code>sizeof</code>.</li>
<li>Integer promotion: <code>char</code> and <code>short</code> are promoted to <code>int</code> in expressions. Mixing signed and unsigned converts the signed value to unsigned, a classic bug (<code>-1 &lt; 1u</code> is false).</li>
<li>Signed overflow is undefined behavior. Unsigned overflow wraps around.</li>
<li>Integer division truncates toward zero. <code>%</code> takes the sign of the left operand.</li>
<li><code>&amp;&amp;</code> and <code>||</code> short-circuit. Mixing up <code>=</code> and <code>==</code> is a frequent mistake.</li>
<li>Precedence trap: <code>a &amp; b == c</code> parses as <code>a &amp; (b == c)</code>. Use parentheses.</li>
</ul>
<h2 id="3-control-flow">3. Control Flow</h2>
<p><code>if/else</code>, <code>switch</code> (needs <code>break</code> or it falls through; case labels must be integer constants), <code>for</code>, <code>while</code>, <code>do-while</code>, <code>break</code>, <code>continue</code>, and <code>goto</code> (rare, mostly for cleanup in error paths).</p>
<h2 id="4-functions">4. Functions</h2>
<ul>
<li>C is always pass by value. To modify the caller&#x27;s variable, pass a pointer.</li>
<li>Declare prototypes in headers; define functions in .c files.</li>
<li>Arrays decay to pointers when passed, so also pass the length.</li>
<li>Recursion uses the stack; each call has a stack frame. Very deep recursion causes stack overflow.</li>
<li>Use <code>int main(void)</code> or <code>int main(int argc, char *argv[])</code>. Never <code>void main()</code>.</li>
<li>Variadic functions (like <code>printf</code>) use <code>&lt;stdarg.h&gt;</code>: <code>va_list</code>, <code>va_start</code>, <code>va_arg</code>, <code>va_end</code>.</li>
</ul>
<h2 id="5-arrays-and-strings">5. Arrays and Strings</h2>
<pre><code>int a[5] = {1, 2, 3};      // remaining elements are zero
int b[] = {1, 2, 3, 4};    // size deduced as 4
char s1[] = &quot;hello&quot;;       // modifiable copy, 6 bytes
char *s2 = &quot;hello&quot;;        // points to read-only literal</code></pre>
<ul>
<li>A string is a <code>char</code> array ending with <code>&#x27;\0&#x27;</code>.</li>
<li><code>sizeof(arr)</code> gives total bytes only where <code>arr</code> is a real array, not a function parameter.</li>
<li>Out-of-bounds access is undefined behavior; C does no bounds checking.</li>
<li>Key functions: <code>strlen</code>, <code>strcmp</code>, <code>strcpy</code>, <code>strncpy</code>, <code>strcat</code>, <code>strstr</code>, <code>strchr</code>, <code>memcpy</code>, <code>memmove</code>, <code>memset</code>. Use <code>memmove</code> if regions overlap.</li>
<li><code>strncpy</code> does not always null-terminate. Prefer <code>snprintf</code> for safe formatting.</li>
<li>Never use <code>gets()</code>. Use <code>fgets()</code>.</li>
<li>2D arrays are stored row-major: <code>int m[3][4]</code> is 12 contiguous ints.</li>
</ul>
<h2 id="6-pointers-the-heart-of-c">6. Pointers (the Heart of C)</h2>
<p>A pointer stores a memory address.</p>
<pre><code>int x = 10;
int *p = &amp;x;     // p holds the address of x
*p = 20;         // x is now 20
int **pp = &amp;p;   // pointer to pointer</code></pre>
<p><strong>Key rules</strong></p>
<ul>
<li>Pointer arithmetic scales by element size: <code>p + 1</code> advances by <code>sizeof(*p)</code> bytes.</li>
<li><code>a[i]</code> is exactly <code>*(a + i)</code>.</li>
<li>An array name is not a pointer, but it decays to one in most expressions (exceptions: <code>sizeof</code> and <code>&amp;</code>).</li>
<li><code>void *</code> is a generic pointer; you cannot dereference it or do arithmetic on it directly.</li>
<li>Dereferencing <code>NULL</code> crashes (segmentation fault). Always check the return of <code>malloc</code> and <code>fopen</code>.</li>
<li>Pointer subtraction gives the element count between two pointers (type <code>ptrdiff_t</code>).</li>
</ul>
<p><strong>const with pointers</strong> (read right to left)</p>
<ul>
<li><code>const int *p</code>: value is read-only, pointer can move.</li>
<li><code>int *const p</code>: pointer is fixed, value can change.</li>
<li><code>const int *const p</code>: both fixed.</li>
</ul>
<p><strong>Pointer expressions interviewers love</strong></p>
<ul>
<li><code>*p++</code>: use the value, then increment the pointer.</li>
<li><code>(*p)++</code>: increment the value.</li>
<li><code>*++p</code>: increment the pointer, then use the value.</li>
<li><code>++*p</code>: increment the value, then use it.</li>
</ul>
<p>Pointer to array vs array of pointers: <code>int (*p)[5]</code> is a pointer to an array of 5 ints; <code>int *p[5]</code> is an array of 5 int pointers.</p>
<h2 id="7-dynamic-memory">7. Dynamic Memory</h2>
<pre><code>int *p = malloc(n * sizeof *p);
if (p == NULL) { /* handle failure */ }</code></pre>
<pre><code>int *q = realloc(p, 2 * n * sizeof *p);
if (q == NULL) { free(p); /* handle failure */ }
else p = q;</code></pre>
<pre><code>free(p);
p = NULL;</code></pre>
<ul>
<li><code>malloc</code> returns uninitialized memory. <code>calloc(n, size)</code> zero-initializes.</li>
<li><code>realloc</code> may move the block, so assign its result to a temporary first.</li>
<li>Every <code>malloc</code> needs exactly one <code>free</code>.</li>
<li>Memory bugs: leak (never freed), dangling pointer (use after free), double free, buffer overflow, uninitialized read, wild pointer (never initialized).</li>
<li>Never return a pointer to a local variable; it lives on the stack and dies when the function returns.</li>
<li>Stack: automatic, fast, limited size, holds locals. Heap: manual, larger, slower, persists until freed. Also: data segment (initialized globals), BSS (uninitialized globals, zeroed), text segment (code).</li>
</ul>
<h2 id="8-structs-unions-enums-typedef">8. Structs, Unions, Enums, typedef</h2>
<pre><code>typedef struct {
    int id;
    char name[32];
} Student;</code></pre>
<pre><code>Student s = { .id = 1, .name = &quot;Asha&quot; };
Student *ps = &amp;s;
ps-&gt;id = 2;          // same as (*ps).id</code></pre>
<ul>
<li>Structs are copied by value on assignment and when passed to functions.</li>
<li>Padding: the compiler inserts bytes so members align. <code>sizeof</code> a struct can exceed the sum of its members. Order members from largest to smallest to reduce size. Use <code>offsetof</code> to inspect.</li>
<li>A union shares one memory block among its members; its size equals the largest member. Only the last-written member is safely readable.</li>
<li><code>enum</code> constants are integers starting at 0.</li>
<li>Bit-fields (<code>unsigned flag : 1;</code>) pack bits, but their layout is implementation-defined.</li>
<li>Flexible array member: <code>struct { int n; int data[]; }</code> allocated with <code>malloc(sizeof(struct) + n * sizeof(int))</code>.</li>
</ul>
<h2 id="9-storage-classes-and-qualifiers">9. Storage Classes and Qualifiers</h2>
<ul>
<li><code>auto</code>: default for locals.</li>
<li><code>static</code> local: initialized once, keeps its value across calls, lives in the data segment.</li>
<li><code>static</code> global or function: visible only inside that file (internal linkage).</li>
<li><code>extern</code>: declares a variable or function defined in another file.</li>
<li><code>register</code>: a hint, mostly ignored; you cannot take its address.</li>
<li><code>const</code>: read-only. In C, a <code>const</code> variable is not a compile-time constant.</li>
<li><code>volatile</code>: the value may change unexpectedly (hardware registers, interrupt handlers), so the compiler must not optimize reads away. It does not give thread safety.</li>
<li><code>restrict</code>: a promise that a pointer is the only access to that memory, enabling optimizations.</li>
<li><code>inline</code>: a suggestion to inline a function.</li>
</ul>
<h2 id="10-preprocessor">10. Preprocessor</h2>
<pre><code>#define PI 3.14159
#define SQUARE(x) ((x) * (x))
#define MAX(a, b) ((a) &gt; (b) ? (a) : (b))</code></pre>
<pre><code>#ifndef MYHEADER_H
#define MYHEADER_H
/* declarations */
#endif</code></pre>
<ul>
<li>Macros are text substitution with no type checking. <code>SQUARE(i++)</code> evaluates <code>i++</code> twice (bug). Always parenthesize arguments and the whole body.</li>
<li><code>#</code> stringifies an argument; <code>##</code> pastes tokens.</li>
<li>Include guards (or <code>#pragma once</code>) prevent double inclusion.</li>
<li><code>#include &lt;file&gt;</code> searches system paths; <code>#include &quot;file&quot;</code> searches the local directory first.</li>
<li>Conditional compilation: <code>#if</code>, <code>#ifdef</code>, <code>#else</code>, <code>#endif</code>. Predefined: <code>__FILE__</code>, <code>__LINE__</code>, <code>__func__</code>.</li>
<li>Prefer <code>const</code> and <code>enum</code> over macros for constants, and <code>static inline</code> over function-like macros.</li>
</ul>
<h2 id="11-file-i-o">11. File I/O</h2>
<pre><code>FILE *f = fopen(&quot;data.txt&quot;, &quot;r&quot;);
if (!f) { perror(&quot;fopen&quot;); return 1; }
char line[256];
while (fgets(line, sizeof line, f)) {
    printf(&quot;%s&quot;, line);
}
fclose(f);</code></pre>
<ul>
<li>Modes: <code>r</code>, <code>w</code> (truncates), <code>a</code> (append), <code>r+</code>, <code>w+</code>, <code>a+</code>; add <code>b</code> for binary.</li>
<li>Functions: <code>fprintf</code>, <code>fscanf</code>, <code>fgets</code>, <code>fputs</code>, <code>fread</code>, <code>fwrite</code>, <code>fseek</code>, <code>ftell</code>, <code>rewind</code>, <code>feof</code>, <code>fflush</code>.</li>
<li>Do not loop on <code>while (!feof(f))</code>; check the return value of the read instead.</li>
<li><code>stdin</code>, <code>stdout</code>, <code>stderr</code> are always open. <code>stdout</code> is buffered; <code>stderr</code> is not.</li>
<li><code>scanf</code> returns the number of items read; always check it. <code>%s</code> without a width can overflow, so use <code>%31s</code>.</li>
</ul>
<h2 id="12-bitwise-operations">12. Bitwise Operations</h2>
<pre><code>x &amp; (1u &lt;&lt; n)       // test bit n
x |= (1u &lt;&lt; n);     // set bit n
x &amp;= ~(1u &lt;&lt; n);    // clear bit n
x ^= (1u &lt;&lt; n);     // toggle bit n
x &amp; (x - 1)         // clear lowest set bit
x &amp; -x              // isolate lowest set bit
(x &amp; (x - 1)) == 0  // power of two (x &gt; 0)</code></pre>
<ul>
<li>Count set bits: loop with <code>x &amp;= x - 1</code> (Brian Kernighan&#x27;s method).</li>
<li>Right shift of negative signed values is implementation-defined; shifting by the width or more is undefined.</li>
<li>Swap without a temp: <code>a ^= b; b ^= a; a ^= b;</code> (fails if both refer to the same variable).</li>
<li>Endianness check: <code>int n = 1; *(char *)&amp;n == 1</code> means little endian.</li>
</ul>
<h2 id="13-function-pointers-and-callbacks">13. Function Pointers and Callbacks</h2>
<pre><code>int add(int a, int b) { return a + b; }
int (*op)(int, int) = add;
int r = op(2, 3);</code></pre>
<pre><code>qsort(arr, n, sizeof arr[0], cmp);   // cmp is a callback</code></pre>
<p>Uses: callbacks, dispatch tables, simple polymorphism, plugin-style design.</p>
<h2 id="14-undefined-behavior">14. Undefined Behavior</h2>
<ul>
<li><strong>Undefined:</strong> out-of-bounds access, null dereference, signed overflow, use after free, modifying a string literal, unsequenced modification (<code>i = i++ + ++i</code>), reading uninitialized variables, using the value of a non-void function that lacks a return.</li>
<li><strong>Unspecified:</strong> order of evaluation of function arguments.</li>
<li><strong>Implementation-defined:</strong> size of int, signedness of plain char, struct padding.</li>
<li>With undefined behavior anything can happen, including appearing to work.</li>
</ul>
<h2 id="15-data-structures-to-implement">15. Data Structures to Implement</h2>
<p>Do each of these at least once, with full memory management:</p>
<ul>
<li>Dynamic array (vector) with resize</li>
<li>Singly and doubly linked list (insert, delete, reverse, find middle, detect cycle)</li>
<li>Stack and queue (array and linked-list versions)</li>
<li>Circular buffer</li>
<li>Hash table with chaining</li>
<li>Binary search tree (insert, search, delete, traversals)</li>
<li>Min-heap / priority queue</li>
<li>String library: <code>strlen</code>, <code>strcpy</code>, <code>strcmp</code>, <code>strstr</code>, <code>atoi</code>, <code>itoa</code>, <code>memcpy</code>, <code>memmove</code></li>
</ul>
<h2 id="16-interview-questions-with-answers">16. Interview Questions with Answers</h2>
<p><strong>Difference between malloc and calloc? </strong><code>calloc</code> takes count and size and zeroes the memory; <code>malloc</code> takes total bytes and leaves it uninitialized.</p>
<p><strong>What is a dangling pointer? </strong>A pointer to memory that has been freed or gone out of scope. Fix: set it to <code>NULL</code> after <code>free</code>; never return addresses of locals.</p>
<p><strong>What is a memory leak? </strong>Heap memory that was allocated but never freed and is no longer reachable.</p>
<p><strong>Stack vs heap? </strong>Stack is automatic, fast, small, with LIFO frames. Heap is manual, flexible, larger, and can fragment.</p>
<p><strong>What does static do? </strong>Local: persists between calls. Global or function: limits visibility to the file.</p>
<p><strong>const vs #define? </strong><code>const</code> has a type and scope and shows in the debugger; <code>#define</code> is untyped text replacement.</p>
<p><strong>Array vs pointer? </strong>An array is a block of storage; a pointer is a variable holding an address. Arrays decay to pointers, but <code>sizeof</code> and <code>&amp;</code> treat them differently.</p>
<p><strong>Why is a write to a string literal a bug? </strong><code>char *s = &quot;abc&quot;; s[0] = &#x27;x&#x27;;</code> modifies a string literal, which is undefined behavior. Use <code>char s[] = &quot;abc&quot;;</code> instead.</p>
<p><strong>What is void pointer? </strong>A generic pointer; it must be cast before dereferencing. <code>malloc</code> returns it.</p>
<p><strong>struct vs union? </strong>Struct members have separate storage; union members overlap in the same memory.</p>
<p><strong>What is a segmentation fault? </strong>Access to memory the process may not touch: null or wild pointers, stack overflow, writing read-only memory.</p>
<p><strong>What is volatile for? </strong>It stops the compiler from caching or optimizing away reads of a variable that can change outside normal program flow.</p>
<p><strong>i++ vs ++i? </strong>Both increment; the value of the expression differs (old value vs new value).</p>
<p><strong>Common macro pitfalls? </strong>Double evaluation of arguments and missing parentheses.</p>
<p><strong>When is sizeof evaluated? </strong>At compile time (except for variable-length arrays).</p>
<p><strong>How do you avoid buffer overflow? </strong>Check lengths, use <code>fgets</code>, <code>snprintf</code>, and <code>strncpy</code> with explicit termination, and validate all input sizes.</p>
<p><strong>What is memory alignment? </strong>Hardware prefers data at addresses that are multiples of its size; compilers pad structs for this.</p>
<p><strong>What if you free the same pointer twice? </strong>Undefined behavior; usually heap corruption or a crash.</p>
<p><strong>memcpy vs memmove? </strong><code>memmove</code> handles overlapping regions correctly; <code>memcpy</code> does not.</p>
<p><strong>What is a reentrant function? </strong>One that is safe to call again before a previous call finishes (no static or global state). Required for interrupt handlers and threads.</p>
<p><strong>What is the difference between a macro and an inline function? </strong>A macro is expanded by the preprocessor with no type checking; an inline function is type-checked and evaluates its arguments once.</p>
<p><strong>What is a null pointer vs an uninitialized pointer? </strong>A null pointer deliberately points to nothing and can be tested. An uninitialized pointer holds a garbage address and cannot be tested safely.</p>
<p><strong>What are the different memory segments of a C program? </strong>Text (code), initialized data, BSS (zero-initialized data), heap, and stack.</p>
<p><strong>What does extern do? </strong>It declares that a variable or function is defined in another translation unit, without allocating storage.</p>
<h2 id="17-classic-coding-problems">17. Classic Coding Problems</h2>
<ul>
<li>Reverse a string in place; check for palindrome</li>
<li>Reverse a linked list (iterative and recursive); find the middle; detect and remove a loop (Floyd)</li>
<li>Merge two sorted lists</li>
<li>Find the missing number; find duplicates</li>
<li>Count set bits; reverse bits; check power of two</li>
<li>Swap two variables without a temp</li>
<li>Implement atoi and itoa with edge cases (sign, overflow, whitespace)</li>
<li>Binary search; bubble, insertion, quick and merge sort</li>
<li>Fibonacci and factorial (recursive and iterative)</li>
<li>Matrix transpose and rotate</li>
<li>Implement memcpy and handle overlap in memmove</li>
<li>Check endianness</li>
<li>Remove duplicates from a sorted array</li>
<li>Balanced parentheses using a stack</li>
<li>Implement a circular queue or simple LRU cache</li>
</ul>
<h2 id="18-debugging-and-tooling">18. Debugging and Tooling</h2>
<ul>
<li><code>gcc -Wall -Wextra -Wpedantic -g -fsanitize=address,undefined</code> catches most memory and undefined-behavior bugs early.</li>
<li><code>valgrind ./prog</code> finds leaks and invalid reads and writes.</li>
<li><code>gdb ./prog</code>: <code>break</code>, <code>run</code>, <code>next</code>, <code>step</code>, <code>print</code>, <code>backtrace</code>, <code>watch</code>.</li>
<li><code>make</code> for builds; <code>clang-format</code> and <code>cppcheck</code> for style and static checks.</li>
</ul>
<h2 id="19-how-to-study-effectively">19. How to Study Effectively</h2>
<ul>
<li>Type every example yourself; do not just read.</li>
<li>Draw memory diagrams (stack, heap, pointer arrows) for every pointer problem.</li>
<li>After each topic, write a small program that uses it, then deliberately break it and read the error.</li>
<li>Solve 2 to 3 problems a day on HackerRank or LeetCode in C only.</li>
<li>Explain concepts aloud as if answering an interviewer.</li>
<li>Read good code: the Linux kernel list implementation, SQLite, or Redis source.</li>
</ul>
<p><strong>Recommended books:</strong> The C Programming Language (Kernighan and Ritchie); C Programming: A Modern Approach (K. N. King); Expert C Programming: Deep C Secrets (van der Linden); Understanding and Using C Pointers (Reese).</p>
<p><strong>Free resources:</strong> Beej&#x27;s Guide to C, Harvard CS50, Exercism C track.</p>

<h2 id="b6-bit-manipulation-tricks">B6. Bit Manipulation Tricks</h2>
<pre><code>x &amp; (1u &lt;&lt; n)          // test bit n
x |  (1u &lt;&lt; n)         // set bit n
x &amp; ~(1u &lt;&lt; n)         // clear bit n
x ^  (1u &lt;&lt; n)         // toggle bit n
x &amp; (x - 1)            // clear lowest set bit
x &amp; -x                 // isolate lowest set bit
(x &amp; (x - 1)) == 0     // power of two (x &gt; 0)
x &lt;&lt; k                 // multiply by 2^k
x &gt;&gt; k                 // divide by 2^k (unsigned)
(x &gt;&gt; n) &amp; 1u          // extract bit n
(x &gt;&gt; p) &amp; ((1u &lt;&lt; w) - 1)   // extract w bits starting at bit p</code></pre>
<pre><code>// Count set bits (Kernighan)
int count = 0;
while (x) { x &amp;= x - 1; count++; }</code></pre>
<h2 id="b7-must-know-code-snippets">B7. Must-Know Code Snippets</h2>
<h3 id="swap-using-a-temporary-and-using-a-pointer">Swap using a temporary and using a pointer</h3>
<pre><code>void swap(int *a, int *b) {
    int t = *a;
    *a = *b;
    *b = t;
}</code></pre>
<h3 id="string-length-and-string-copy">String length and string copy</h3>
<pre><code>size_t my_strlen(const char *s) {
    const char *p = s;
    while (*p) p++;
    return p - s;
}</code></pre>
<pre><code>char *my_strcpy(char *d, const char *s) {
    char *r = d;
    while ((*d++ = *s++)) ;
    return r;
}</code></pre>
<h3 id="reverse-a-string-in-place">Reverse a string in place</h3>
<pre><code>void reverse(char *s) {
    int i = 0, j = strlen(s) - 1;
    while (i &lt; j) {
        char t = s[i];
        s[i++] = s[j];
        s[j--] = t;
    }
}</code></pre>
<h3 id="linked-list-node-and-reverse">Linked list node and reverse</h3>
<pre><code>struct Node { int data; struct Node *next; };</code></pre>
<pre><code>struct Node *reverse_list(struct Node *head) {
    struct Node *prev = NULL, *cur = head;
    while (cur) {
        struct Node *next = cur-&gt;next;
        cur-&gt;next = prev;
        prev = cur;
        cur = next;
    }
    return prev;
}</code></pre>
<h3 id="detect-a-cycle-floyd">Detect a cycle (Floyd)</h3>
<pre><code>int has_cycle(struct Node *head) {
    struct Node *slow = head, *fast = head;
    while (fast &amp;&amp; fast-&gt;next) {
        slow = slow-&gt;next;
        fast = fast-&gt;next-&gt;next;
        if (slow == fast) return 1;
    }
    return 0;
}</code></pre>
<h3 id="atoi-with-sign-handling">atoi with sign handling</h3>
<pre><code>int my_atoi(const char *s) {
    int sign = 1, n = 0;
    while (*s == &#x27; &#x27;) s++;
    if (*s == &#x27;-&#x27;) { sign = -1; s++; }
    else if (*s == &#x27;+&#x27;) s++;
    while (*s &gt;= &#x27;0&#x27; &amp;&amp; *s &lt;= &#x27;9&#x27;)
        n = n * 10 + (*s++ - &#x27;0&#x27;);
    return sign * n;
}</code></pre>
<h3 id="endianness-check">Endianness check</h3>
<pre><code>int n = 1;
puts(*(char *)&amp;n ? &quot;little endian&quot; : &quot;big endian&quot;);</code></pre>
<h3 id="function-pointer-and-qsort-comparator">Function pointer and qsort comparator</h3>
<pre><code>int cmp(const void *a, const void *b) {
    int x = *(const int *)a, y = *(const int *)b;
    return (x &gt; y) - (x &lt; y);   // avoids overflow of x - y
}
qsort(arr, n, sizeof arr[0], cmp);</code></pre>
